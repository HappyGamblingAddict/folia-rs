name: CI

# Differential tests are the only defense against "looks close, behaves
# differently" regressions, so every push and PR must pass them.
#
# The checkout must contain the generated files under
# crates/folia-core/assets (see assets/ASSETS.md) and the world/region fixture;
# the build embeds the assets with include_str!/include_bytes!.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The Java plugin bridge is optional; CI runs the fully native path.
  FOLIA_DISABLE_PLUGINS: "1"

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Release build
        run: cargo build --workspace --release
